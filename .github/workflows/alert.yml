name: Alert panic selling

on:
  schedule:
    # Ogni 5 minuti, dalle 13 alle 15 UTC, dal lunedì al venerdì: copre i
    # "10 minuti dopo l'apertura" di Wall Street sia con l'ora solare
    # (15:40 italiane) sia con quella legale (14:40 italiane). Lo script
    # agisce solo nella finestra utile e manda l'alert una sola volta al
    # giorno. GitHub può ritardare l'avvio di qualche minuto.
    - cron: "*/5 13-15 * * 1-5"
  # permette l'avvio manuale, per i test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install yfinance

      - name: Controllo del paniere
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          THRESHOLD_PCT: "-7"
          # i lanci manuali ignorano la finestra oraria, per testare sempre
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python monitor.py

      - name: Salva lo stato (evita alert ripetuti)
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "aggiorna stato alert"
              git push
            fi
          fi
