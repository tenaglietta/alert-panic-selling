name: Alert panic selling

on:
  schedule:
    # Ogni 15 minuti, dalle 13 alle 21 UTC (copre le 14:30-22:00 italiane),
    # dal lunedì al venerdì. GitHub può ritardare l'avvio di qualche minuto.
    - cron: "*/15 13-21 * * 1-5"
  # permette l'avvio manuale, per i test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install yfinance

      - name: Controllo del paniere
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          THRESHOLD_PCT: "-7"
        run: python monitor.py

      - name: Salva lo stato (evita alert ripetuti)
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "aggiorna stato alert"
            git push
          fi
